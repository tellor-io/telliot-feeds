---
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-latest"
    env:
      USING_COVERAGE: '3.12'
      NODE_URL: ${{ secrets.TEST_NODE_URL }}
      PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
      INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: "actions/checkout@v2"
      - uses: "astral-sh/setup-uv@v10.3.2"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: '20'
            cache: 'npm'

      - run: npm ci

      - name: "Start hardhat node"
        run: |
          npx hardhat node > /tmp/hardhat-node.log 2>&1 &
          timeout 90 bash -c 'until curl -sf -o /dev/null -X POST -H "content-type: application/json" --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}" http://127.0.0.1:8545; do sleep 1; done'

      - name: "Install dependencies"
        run: uv sync --frozen

      - name: "Compile ape project"
        run: |
          uv run ape plugins install . --upgrade --yes
          uv run ape compile

      - name: "Run tests"
        run: >-
          uv run pytest --cov --cov-report xml
          --reruns 3 --reruns-delay 2
          --only-rerun "TimeoutError" --only-rerun "ConnectionError"
          --only-rerun "RemoteDisconnected" --only-rerun "IncompleteRead"
          --only-rerun "requests\.exceptions" --only-rerun "aiohttp"
          --only-rerun "StatusError" --only-rerun "429|4(0|2)9|too many"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
