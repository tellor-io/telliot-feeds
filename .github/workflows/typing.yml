---
name: typing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  typing:
    name: "Typing enforcement on Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: "actions/checkout@v2"
      - uses: "astral-sh/setup-uv@v10.3.2"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "Install dependencies"
        run: uv sync --frozen
      - name: "Run mypy"
        run: >-
          uv run mypy --strict --install-types --non-interactive src
          --implicit-reexport --ignore-missing-imports
          --disable-error-code misc --exclude src/telliot_feeds/proto/
