# Project information
site_name: Telliot Feeds
site_url: https://tellor-io.github.io/telliot-feeds/
site_author: Tellor Development Community
site_description: >-
  Tools for interacting with Tellor Protocol smart contracts.

# Repository
repo_name: tellor-io/telliot-feeds
repo_url: https://github.com/tellor-io/telliot-feeds
edit_uri: ""

# Copyright
copyright: Copyright (c) 2021-, Tellor Development Community

theme:
  name: material
  features:
    - navigation.sections
  palette:
    primary: black
    scheme: default

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
